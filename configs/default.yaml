# Privacy Gateway Configuration
# Developed by 48sh1xbh
app:
  name: "Privacy Gateway"
  developer: "48sh1xbh"
  version: "0.2.0-m2"
  environment: "production"

network:
  probe_timeout: 5s
  enable_ipv6: false
  dns_servers:
    - "1.1.1.1"
    - "9.9.9.9"
  ignore_loopback: true
  virtual_interface_prefixes:
    - "tun"
    - "tap"
    - "wg"
    - "tailscale"
    - "proton"
    - "openvpn"
    - "ppp"

tor:
  enabled: false
  control_endpoint: "127.0.0.1:9051"
  network_mode: "tcp"
  connection_timeout: 5s
  auth_preference: "safecookie"
  cookie_path: ""
  event_subscriptions:
    - "STATUS_CLIENT"
    - "CIRC"
    - "STREAM"
  reconnect_attempts: 3
  reconnect_backoff: 1s
  event_queue_limit: 1000
  inspector_path: "pg-tor-inspector"
  inspector_timeout: 2s
  max_protocol_msg_size: 65536

logging:
  level: "INFO"
  log_to_console: true
  log_to_file: true
  filename: "privacy-gateway.log"
  redact_sensitive: true

storage:
  log_dir: "Logs"
  report_dir: "Reports"
  recycle_bin_dir: "Recycle Bin"
  backup_dir: "Backups"

firewall:
  mode: "simulate"
  default_block: false
  allow_local_dns: true

privacy:
  strict_interface_check: true
  warn_on_ipv6: true
  warn_on_hostname_leak: true

telemetry:
  enabled: false
  allow_anonymous: false
  destination: ""
